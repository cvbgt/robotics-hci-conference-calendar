name: Check conference data

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Includes generated-file freshness; never rebuild to hide stale data.
      - run: python3 tools/confcal.py check
